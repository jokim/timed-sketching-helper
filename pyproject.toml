[project]
name = "timed-sketching-helper"
version = "0.1.0"
description = "Local web app for timed drawing practice from DeviantArt galleries and favourites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joakim Hovlandsvåg", email = "joakim.hovlandsvag@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["drawing", "sketching", "gesture-drawing", "reference", "deviantart", "fastapi"]
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/jokim/timed-sketching-helper"
Repository = "https://github.com/jokim/timed-sketching-helper"
Issues = "https://github.com/jokim/timed-sketching-helper/issues"

[project.scripts]
timed-sketching-helper = "timed_sketching_helper:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]
